<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#701c35">
<title>Story Map RT MBSA | Rancangan Pemajuan Negeri Selangor</title>
<style>
:root{font-family:Arial,sans-serif;color:#fff7ec;background:#3e0d23}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
.rt-toolbar{height:50px;display:flex;align-items:center;gap:14px;justify-content:space-between;padding:6px 16px;background:linear-gradient(95deg,#500b24,#882e46);border-bottom:2px solid #e1b96c}
.rt-toolbar b{font-size:13px;letter-spacing:.02em}.rt-toolbar a{color:#fff4d6;font-size:12px;text-decoration:none;white-space:nowrap}.rt-toolbar a:hover{text-decoration:underline}
.rt-toolbar nav{display:flex;align-items:center;gap:16px}
#rt-story-frame{display:block;width:100%;height:calc(100dvh - 50px);border:0;background:#fff9f4}
@media(max-width:650px){.rt-toolbar{padding:6px 9px;gap:7px}.rt-toolbar b{font-size:11px}.rt-toolbar nav{gap:8px}.rt-toolbar nav a{font-size:10px}}
</style>
</head>
<body data-rt-page="MBSA">
<header class="rt-toolbar">
<b>RANCANGAN TEMPATAN · MBSA</b>
<nav aria-label="Navigasi halaman RT">
<a href="./MDSB.html" title="RT sebelumnya">‹ Sebelum</a>
<a href="../index.html#panel-3">Portal Utama</a>
<a href="./MBPJ.html" title="RT seterusnya">Seterusnya ›</a>
</nav>
</header>
<iframe id="rt-story-frame" title="Story Map Rancangan Tempatan Shah Alam" src="../index.html?rt_page=MBSA" loading="eager"></iframe>
<script>
/* Halaman khusus MBSA: letakkan penyesuaian gaya untuk RT ini di bawah.
   Kandungan asas masih dibaca daripada portal utama agar maklumat asal terpelihara. */
const frame=document.getElementById('rt-story-frame');
frame.addEventListener('load',()=>{
 try{
  const doc=frame.contentDocument;
  if(!doc)return;
  const style=doc.createElement('style');
  style.id='rt-page-MBSA-overrides';
  style.textContent='/* Styles applied after RT source content loads */';
  doc.head.appendChild(style);
  /* RT MBSA only: justify all long-form body text while preserving headings and controls. */
  const justifyStyle=doc.createElement('style');
  justifyStyle.id='rt-page-MBSA-justify';
  justifyStyle.textContent=`
    #rt11-body p,
    #rt11-body li,
    #rt11-body blockquote,
    #rt11-body dd,
    #rt11-body td,
    #rt11-body .mbsa-feature-card p,
    #rt11-body .mbsa-feature-desc,
    #rt11-modal .rtchapter p,
    #rt11-modal .rtchapter li,
    #rt11-modal .rtchapter blockquote{
      text-align:justify!important;
      text-align-last:left;
      text-justify:inter-word;
      overflow-wrap:break-word;
      hyphens:auto;
    }
    #rt11-body h1,#rt11-body h2,#rt11-body h3,#rt11-body h4,
    #rt11-body h5,#rt11-body h6,
    #rt11-body button,#rt11-body nav,
    #rt11-body .mbsa-feature-title,#rt11-body .mbsa-feature-kicker{
      text-align:revert;
    }
    @media(max-width:480px){
      #rt11-body p,#rt11-body li,#rt11-body dd,
      #rt11-modal .rtchapter p,#rt11-modal .rtchapter li{
        hyphens:auto;
      }
    }
  `;
  doc.head.appendChild(justifyStyle);

/* Bina semula susun atur daripada teks RT MBSA yang sudah wujud, tanpa menukar maklumat asal. */
(function(){
 const doc=frame.contentDocument;if(!doc)return;
 const style=doc.getElementById('rt-page-MBSA-overrides');
 if(style)style.textContent="\n/* RT MBSA: tema biru korporat, khas untuk dua seksyen ini sahaja */\n#rt11-body .mbsa-feature-section{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(130deg,#f8fbff 0%,#ebf4ff 52%,#e6f0fd 100%);border:1px solid #c5d9f0;border-radius:22px;padding:28px 26px 26px;margin:24px 0;box-shadow:0 12px 30px rgba(21,60,111,.075);font-family:Arial,sans-serif}\n#rt11-body .mbsa-feature-section::before{content:\"\";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#19477e,#3893d6,#96d9ff);z-index:0}\n#rt11-body .mbsa-feature-section::after{content:\"\";pointer-events:none;position:absolute;right:-70px;top:-100px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(92,173,236,.14),transparent 70%);z-index:0}\n#rt11-body .mbsa-feature-section>*{position:relative;z-index:1}\n#rt11-body .mbsa-feature-kicker{display:block;text-align:center;color:#3972af;letter-spacing:.16em;font-weight:800;font-size:11px;margin-bottom:9px}\n#rt11-body .mbsa-feature-title{font:700 clamp(23px,2.7vw,31px)/1.18 Georgia,serif!important;text-align:center;color:#183c70!important;margin:0 0 10px!important}\n#rt11-body .mbsa-feature-desc{text-align:center;color:#536b85;font-size:13px;line-height:1.6;margin:0 auto 23px;max-width:740px}\n#rt11-body .mbsa-feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;align-items:stretch}\n#rt11-body .mbsa-feature-card{position:relative;min-width:0;min-height:205px;padding:21px 20px 22px;background:linear-gradient(150deg,#fff 0%,#f9fcff 100%);border:1px solid #c9dbee;border-radius:16px;box-shadow:0 6px 14px rgba(25,71,126,.055);transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease,background .28s ease}\n#rt11-body .mbsa-feature-card::before{content:\"\";position:absolute;left:20px;bottom:0;width:calc(100% - 40px);height:3px;border-radius:5px 5px 0 0;background:linear-gradient(90deg,#235b9b,#59afe7);transform:scaleX(0);transform-origin:left;transition:transform .28s ease}\n#rt11-body .mbsa-feature-card:hover{transform:translateY(-5px);border-color:#7bb3e4;box-shadow:0 14px 28px rgba(24,72,123,.16);background:linear-gradient(145deg,#fff,#eff7ff)}\n#rt11-body .mbsa-feature-card:hover::before{transform:scaleX(1)}\n#rt11-body .mbsa-feature-num{position:absolute;right:17px;top:17px;border-radius:7px;padding:5px 7px;background:#e3f0fe;color:#1c578f;font:800 11px Arial,sans-serif}\n#rt11-body .mbsa-feature-symbol{display:grid;place-items:center;width:42px;height:42px;background:linear-gradient(140deg,#d3eaff,#9ac8f5);color:#17487f;border:1px solid #b7d7f4;border-radius:12px;font-size:20px;margin-bottom:18px;transition:transform .28s ease,background .28s ease}\n#rt11-body .mbsa-feature-card:hover .mbsa-feature-symbol{transform:rotate(-7deg) scale(1.07);background:linear-gradient(140deg,#c2e3ff,#72b3ed)}\n#rt11-body .mbsa-feature-card h4{font:700 18px/1.3 Georgia,serif!important;color:#1d477b!important;margin:0 0 12px!important;padding:0!important;border:0!important}\n#rt11-body .mbsa-feature-card p{font:400 13px/1.7 Arial,sans-serif;color:#455b74;margin:0;text-align:left}\n@media(min-width:601px) and (max-width:900px){#rt11-body .mbsa-feature-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:600px){#rt11-body .mbsa-feature-grid{grid-template-columns:1fr}#rt11-body .mbsa-feature-section{padding:23px 15px}#rt11-body .mbsa-feature-card{min-height:0}}\n@media(prefers-reduced-motion:reduce){#rt11-body .mbsa-feature-card,#rt11-body .mbsa-feature-card::before,#rt11-body .mbsa-feature-symbol{transition:none}}\n";
 const clean=s=>(s||'').replace(/\s+/g,' ').trim();
 const specs=[
  {heading:'Tafsiran Matlamat RT',kicker:'01 · TAFSIRAN MATLAMAT RT',subtitle:'Tiga asas utama yang membentuk hala tuju pembangunan Rancangan Tempatan.',names:['PINTAR','BERDAYA HUNI','BERDAYA TAHAN'],symbols:['✦','⌂','◈']},
  {heading:'Visi, Misi & Wawasan MBSA',kicker:'02 · HALA TUJU MBSA',subtitle:'Aspirasi, komitmen dan wawasan bandar raya Shah Alam.',names:['VISI','MISI','WAWASAN'],symbols:['◇','✧','✺']}
 ];
 function smallestTextMatch(root,txt){
  return [...root.querySelectorAll('h1,h2,h3,h4,h5,h6,strong,b,div,span,p')]
   .filter(e=>!e.closest('.mbsa-feature-section')&&clean(e.textContent).toLowerCase()===txt.toLowerCase())
   .sort((a,b)=>a.querySelectorAll('*').length-b.querySelectorAll('*').length)[0];
 }
 function getEntry(root,name){
  const rx=new RegExp('^'+name+'\\s*[:：-]','i');
  let matches=[...root.querySelectorAll('li,p,div,article')]
   .filter(e=>!e.closest('.mbsa-feature-section')&&rx.test(clean(e.textContent))&&clean(e.textContent).length<650);
  matches.sort((a,b)=>a.querySelectorAll('*').length-b.querySelectorAll('*').length);
  const leaf=matches[0];if(!leaf)return null;
  const block=leaf.closest('li')||leaf;
  const whole=clean(block.textContent);
  const copy=whole.replace(rx,'').trim();
  return {block,description:copy||whole};
 }
 function update(){
  const root=doc.getElementById('rt11-body')||doc.body;
  if(!root)return;
  specs.forEach(spec=>{
   if(root.querySelector('[data-mbsa-feature="'+spec.heading+'"]'))return;
   const heading=smallestTextMatch(root,spec.heading);
   if(!heading)return;
   const entries=spec.names.map(name=>getEntry(root,name));
   if(entries.some(e=>!e))return;
   const section=doc.createElement('section');section.className='mbsa-feature-section';
   section.dataset.mbsaFeature=spec.heading;
   const kicker=doc.createElement('span');kicker.className='mbsa-feature-kicker';kicker.textContent=spec.kicker;
   const title=doc.createElement('h3');title.className='mbsa-feature-title';title.textContent=spec.heading;
   const description=doc.createElement('p');description.className='mbsa-feature-desc';description.textContent=spec.subtitle;
   const grid=doc.createElement('div');grid.className='mbsa-feature-grid';
   entries.forEach((entry,i)=>{
    const card=doc.createElement('article');card.className='mbsa-feature-card';
    const number=doc.createElement('span');number.className='mbsa-feature-num';number.textContent=String(i+1).padStart(2,'0');
    const symbol=doc.createElement('span');symbol.className='mbsa-feature-symbol';symbol.setAttribute('aria-hidden','true');symbol.textContent=spec.symbols[i];
    const h=doc.createElement('h4');h.textContent=spec.names[i];
    const p=doc.createElement('p');p.textContent=entry.description;
    card.append(number,symbol,h,p);grid.appendChild(card);
   });
   section.append(kicker,title,description,grid);
   heading.parentNode.insertBefore(section,heading);
   heading.style.setProperty('display','none','important');
   entries.forEach(entry=>entry.block.style.setProperty('display','none','important'));
  });
 }
 let running=false;const obs=new MutationObserver(()=>{if(running)return;running=true;try{update()}finally{running=false}});
 obs.observe(doc.body,{childList:true,subtree:true});update();
 setTimeout(update,350);setTimeout(update,1500);
})();


/* MBSA hero/sidebar fixes & restrained animated blue ambiance */
(function(){
 const inner=frame.contentDocument;
 if(!inner)return;
 const polish=inner.createElement('style');
 polish.id='mbsa-hero-navigation-polish';
 polish.textContent=`
 /* Only MBSA special page; do not impact other RT documents */
 .mbsa-polished-hero{background-repeat:no-repeat!important;background-size:cover!important;background-position:center center!important}
 .mbsa-polished-hero img.mbsa-hero-image{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important}
 .mbsa-polished-sidebar{box-sizing:border-box!important;max-width:min(100%,340px)!important;overflow-x:hidden!important}
 .mbsa-polished-sidebar *{box-sizing:border-box}
 .mbsa-polished-sidebar a,.mbsa-polished-sidebar button{max-width:100%;min-width:0;overflow-wrap:break-word}
 .mbsa-ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;opacity:.55}
 .mbsa-ambient::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 25% 30%,rgba(84,173,232,.24),transparent 29%),radial-gradient(circle at 78% 67%,rgba(34,111,182,.18),transparent 32%);animation:mbsaAmbient 24s ease-in-out infinite alternate}
 .mbsa-ambient::after{content:"";position:absolute;inset:0;background-image:linear-gradient(120deg,rgba(64,149,217,.12) 1px,transparent 1px),linear-gradient(30deg,rgba(64,149,217,.1) 1px,transparent 1px);background-size:150px 150px;mask-image:linear-gradient(to bottom,transparent,black 25%,black 80%,transparent);animation:mbsaLines 32s linear infinite}
 @keyframes mbsaAmbient{to{transform:translate3d(5%,-5%,0) scale(1.12)}}
 @keyframes mbsaLines{to{background-position:180px -120px,-160px 130px}}
 @media(prefers-reduced-motion:reduce){.mbsa-ambient::before,.mbsa-ambient::after{animation:none}}
 `;
 inner.head.appendChild(polish);
 function reconcile(){
   const win=frame.contentWindow;if(!win)return;
   const viewport=win.innerWidth||inner.documentElement.clientWidth;
   const nodes=[...inner.querySelectorAll('section,header,div,figure')];
   for(const el of nodes){
     if(el.closest('.mbsa-feature-section'))continue;
     const rect=el.getBoundingClientRect();
     if(rect.width<viewport*.65||rect.height<320||rect.height>1600)continue;
     const bg=win.getComputedStyle(el).backgroundImage;
     if(bg&&bg!=='none'&&/url\(/i.test(bg)){
       el.classList.add('mbsa-polished-hero');
       const images=el.querySelectorAll('img');
       if(images.length===1)images[0].classList.add('mbsa-hero-image');
     }
   }
   const headings=[...inner.querySelectorAll('h1,h2,h3,h4,strong,b,div,span')]
     .filter(el=>el.children.length===0&&el.textContent.trim().toUpperCase()==='SENARAI BAB');
   for(const heading of headings){
     const sidebar=heading.closest('aside,nav')||heading.parentElement?.parentElement;
     if(sidebar)sidebar.classList.add('mbsa-polished-sidebar');
   }
   const modal=inner.getElementById('rt11-modal');
   if(modal&&!modal.querySelector('.mbsa-ambient')){
     const ambient=inner.createElement('div');ambient.className='mbsa-ambient';
     ambient.setAttribute('aria-hidden','true');
     modal.prepend(ambient);
     if(win.getComputedStyle(modal).position==='static')modal.style.position='relative';
   }
 }
 reconcile();
 let requested=false;
 const obs=new MutationObserver(()=>{
   if(requested)return;
   requested=true;
   win.requestAnimationFrame(()=>{requested=false;reconcile()});
 });
 const win=frame.contentWindow;
 obs.observe(inner.body,{childList:true,subtree:true});
 win.addEventListener('resize',reconcile);
 setTimeout(reconcile,600);setTimeout(reconcile,1600);
})();

 }catch(err){console.warn('RT page styling is unavailable',err)}
});
</script>
</body>
</html>
