<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#701c35">
<title>Story Map RT MBSA | Rancangan Pemajuan Negeri Selangor</title>
<style>
:root{font-family:Arial,sans-serif;color:#fff7ec;background:#3e0d23}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
.rt-toolbar{height:50px;display:flex;align-items:center;gap:14px;justify-content:space-between;padding:6px 16px;background:linear-gradient(95deg,#500b24,#882e46);border-bottom:2px solid #e1b96c}
.rt-toolbar b{font-size:13px;letter-spacing:.02em}.rt-toolbar a{color:#fff4d6;font-size:12px;text-decoration:none;white-space:nowrap}.rt-toolbar a:hover{text-decoration:underline}
.rt-toolbar nav{display:flex;align-items:center;gap:16px}
#rt-story-frame{display:block;width:100%;height:calc(100dvh - 50px);border:0;background:#fff9f4}
@media(max-width:650px){.rt-toolbar{padding:6px 9px;gap:7px}.rt-toolbar b{font-size:11px}.rt-toolbar nav{gap:8px}.rt-toolbar nav a{font-size:10px}}
</style>
</head>
<body data-rt-page="MBSA">
<header class="rt-toolbar">
<b>RANCANGAN TEMPATAN · MBSA</b>
<nav aria-label="Navigasi halaman RT">
<a href="./MDSB.html" title="RT sebelumnya">‹ Sebelum</a>
<a href="../index.html#panel-3">Portal Utama</a>
<a href="./MBPJ.html" title="RT seterusnya">Seterusnya ›</a>
</nav>
</header>
<iframe id="rt-story-frame" title="Story Map Rancangan Tempatan Shah Alam" src="../index.html?rt_page=MBSA" loading="eager"></iframe>
<script>
/* Halaman khusus MBSA: letakkan penyesuaian gaya untuk RT ini di bawah.
   Kandungan asas masih dibaca daripada portal utama agar maklumat asal terpelihara. */
const frame=document.getElementById('rt-story-frame');
frame.addEventListener('load',()=>{
 try{
  const doc=frame.contentDocument;
  if(!doc)return;
  const style=doc.createElement('style');
  style.id='rt-page-MBSA-overrides';
  style.textContent='/* Styles applied after RT source content loads */';
  doc.head.appendChild(style);

/* Bina semula susun atur daripada teks RT MBSA yang sudah wujud, tanpa menukar maklumat asal. */
(function(){
 const doc=frame.contentDocument;if(!doc)return;
 const style=doc.getElementById('rt-page-MBSA-overrides');
 if(style)style.textContent="\n/* Penampilan khusus dua seksyen RT MBSA; tidak mengubah seksyen RT lain. */\n#rt11-body .mbsa-feature-section{background:linear-gradient(120deg,#fff8f6,#f9e9ed);border:1px solid #eccbd2;border-radius:22px;padding:26px 25px;margin:24px 0;box-shadow:0 12px 30px rgba(101,34,56,.045);font-family:Arial,sans-serif}\n#rt11-body .mbsa-feature-kicker{display:block;text-align:center;color:#ad6e81;letter-spacing:.16em;font-weight:800;font-size:10px;margin-bottom:12px}\n#rt11-body .mbsa-feature-title{font:700 clamp(22px,2.7vw,30px)/1.18 Georgia,serif!important;text-align:center;color:#702840!important;margin:0 0 9px!important}\n#rt11-body .mbsa-feature-desc{text-align:center;color:#806f77;font-size:13px;line-height:1.6;margin:0 auto 21px;max-width:720px}\n#rt11-body .mbsa-feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}\n#rt11-body .mbsa-feature-card{position:relative;min-width:0;padding:20px 17px 22px;background:#fffdfb;border:1px solid #eecbd3;border-radius:16px;box-shadow:0 9px 18px rgba(112,40,64,.055);transition:transform .25s ease,box-shadow .25s ease}\n#rt11-body .mbsa-feature-card:hover{transform:translateY(-4px);box-shadow:0 15px 24px rgba(112,40,64,.14)}\n#rt11-body .mbsa-feature-num{position:absolute;right:15px;top:14px;color:#a45269;background:#f8d4dd;font:800 12px Arial,sans-serif}\n#rt11-body .mbsa-feature-symbol{display:grid;place-items:center;width:40px;height:40px;background:#f8bfc8;color:#752b44;border-radius:12px;font-size:20px;margin-bottom:15px}\n#rt11-body .mbsa-feature-card h4{font:700 18px/1.3 Georgia,serif!important;color:#702840!important;margin:0 0 13px!important}\n#rt11-body .mbsa-feature-card p{font:400 13px/1.65 Arial,sans-serif;color:#6c6369;margin:0}\n@media(max-width:750px){#rt11-body .mbsa-feature-grid{grid-template-columns:1fr}#rt11-body .mbsa-feature-section{padding:20px 16px}}\n@media(prefers-reduced-motion:reduce){#rt11-body .mbsa-feature-card{transition:none}}\n";
 const clean=s=>(s||'').replace(/\s+/g,' ').trim();
 const specs=[
  {heading:'Tafsiran Matlamat RT',kicker:'01 · TAFSIRAN MATLAMAT RT',subtitle:'Tiga asas utama yang membentuk hala tuju pembangunan Rancangan Tempatan.',names:['PINTAR','BERDAYA HUNI','BERDAYA TAHAN'],symbols:['✦','⌂','◈']},
  {heading:'Visi, Misi & Wawasan MBSA',kicker:'02 · HALA TUJU MBSA',subtitle:'Aspirasi, komitmen dan wawasan bandar raya Shah Alam.',names:['VISI','MISI','WAWASAN'],symbols:['◇','✧','✺']}
 ];
 function smallestTextMatch(root,txt){
  return [...root.querySelectorAll('h1,h2,h3,h4,h5,h6,strong,b,div,span,p')]
   .filter(e=>!e.closest('.mbsa-feature-section')&&clean(e.textContent).toLowerCase()===txt.toLowerCase())
   .sort((a,b)=>a.querySelectorAll('*').length-b.querySelectorAll('*').length)[0];
 }
 function getEntry(root,name){
  const rx=new RegExp('^'+name+'\\s*[:：-]','i');
  let matches=[...root.querySelectorAll('li,p,div,article')]
   .filter(e=>!e.closest('.mbsa-feature-section')&&rx.test(clean(e.textContent))&&clean(e.textContent).length<650);
  matches.sort((a,b)=>a.querySelectorAll('*').length-b.querySelectorAll('*').length);
  const leaf=matches[0];if(!leaf)return null;
  const block=leaf.closest('li')||leaf;
  const whole=clean(block.textContent);
  const copy=whole.replace(rx,'').trim();
  return {block,description:copy||whole};
 }
 function update(){
  const root=doc.getElementById('rt11-body')||doc.body;
  if(!root)return;
  specs.forEach(spec=>{
   if(root.querySelector('[data-mbsa-feature="'+spec.heading+'"]'))return;
   const heading=smallestTextMatch(root,spec.heading);
   if(!heading)return;
   const entries=spec.names.map(name=>getEntry(root,name));
   if(entries.some(e=>!e))return;
   const section=doc.createElement('section');section.className='mbsa-feature-section';
   section.dataset.mbsaFeature=spec.heading;
   const kicker=doc.createElement('span');kicker.className='mbsa-feature-kicker';kicker.textContent=spec.kicker;
   const title=doc.createElement('h3');title.className='mbsa-feature-title';title.textContent=spec.heading;
   const description=doc.createElement('p');description.className='mbsa-feature-desc';description.textContent=spec.subtitle;
   const grid=doc.createElement('div');grid.className='mbsa-feature-grid';
   entries.forEach((entry,i)=>{
    const card=doc.createElement('article');card.className='mbsa-feature-card';
    const number=doc.createElement('span');number.className='mbsa-feature-num';number.textContent=String(i+1).padStart(2,'0');
    const symbol=doc.createElement('span');symbol.className='mbsa-feature-symbol';symbol.setAttribute('aria-hidden','true');symbol.textContent=spec.symbols[i];
    const h=doc.createElement('h4');h.textContent=spec.names[i];
    const p=doc.createElement('p');p.textContent=entry.description;
    card.append(number,symbol,h,p);grid.appendChild(card);
   });
   section.append(kicker,title,description,grid);
   heading.parentNode.insertBefore(section,heading);
   heading.style.setProperty('display','none','important');
   entries.forEach(entry=>entry.block.style.setProperty('display','none','important'));
  });
 }
 let running=false;const obs=new MutationObserver(()=>{if(running)return;running=true;try{update()}finally{running=false}});
 obs.observe(doc.body,{childList:true,subtree:true});update();
 setTimeout(update,350);setTimeout(update,1500);
})();

 }catch(err){console.warn('RT page styling is unavailable',err)}
});
</script>
</body>
</html>
