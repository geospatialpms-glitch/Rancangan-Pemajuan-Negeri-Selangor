<style>
/* Shared navigation and scroll CTA are rendered within index.html's RT header. */
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f5f8}
#rt-story-frame{display:block;width:100%;height:100dvh;border:0;background:#f4f5f8}
</style>
</head>
<body data-rt-page="MDSB">
<iframe id="rt-story-frame" title="Story Map Rancangan Tempatan Sabak Bernam" src="../index.html?rt_page=MDSB&amp;v=20261110-audit-9859e90" loading="eager"></iframe>
<script id="rt-plan-label-performance-20261112">
(function(){
'use strict';
const frame=document.getElementById('rt-story-frame');
if(!frame)return;
const TARGET='PELAN MUKIM & BLOK PERANCANGAN';
const phrase=/PELAN\s+MUKIM\s*(?:&|DAN|\/)\s*BLOK\s+(?:PERANCANGAN|MBSA|MBDK|MBSJ|MDSB|MPAJ|MPHS|MPKL|MPKS|MPKJ|MPS|MPSP|MBPJ)\b/i;
const full=/^\s*(?:\d+(?:\.\d+)*[.)-]?\s*)?PELAN\s+MUKIM\s*(?:&|DAN|\/)\s*BLOK\s+(?:PERANCANGAN|MBSA|MBDK|MBSJ|MDSB|MPAJ|MPHS|MPKL|MPKS|MPKJ|MPS|MPSP|MBPJ)\s*$/i;
const headingSelector='h1,h2,h3,h4,h5,h6,[role="heading"],.section-title,.chapter-title,.rt-section-title';
const navSelector='aside,nav,[class*="sidebar"],[class*="side-nav"],[class*="chapter-nav"],[class*="bab-nav"],[class*="chapter-list"],[class*="nav-list"]';
function install(doc){
 if(!doc||!doc.body||doc.body.dataset.rtPlanLabelsOptimized)return;
 doc.body.dataset.rtPlanLabelsOptimized='1';
 let scheduled=false;
 function fix(){
  scheduled=false;
  doc.querySelectorAll(headingSelector).forEach(el=>{
   if(el.closest('nav,aside,script,style'))return;
   const s=el.textContent.replace(/\s+/g,' ').trim();
   if(s!==TARGET&&full.test(s))el.textContent=TARGET;
  });
  doc.querySelectorAll(navSelector).forEach(root=>{
   const walker=doc.createTreeWalker(root,NodeFilter.SHOW_TEXT);
   while(walker.nextNode()){
    const node=walker.currentNode;
    if(node.parentElement?.closest('script,style'))continue;
    if(phrase.test(node.nodeValue))node.nodeValue=node.nodeValue.replace(phrase,TARGET);
   }
  });
 }
 function schedule(){
  if(scheduled)return;
  scheduled=true;
  setTimeout(fix,350);
 }
 fix();
 const observer=new MutationObserver(records=>{
  for(const record of records){
   if(record.type!=='childList'||!record.addedNodes.length)continue;
   const parent=record.target.nodeType===1?record.target:record.target.parentElement;
   if(parent?.closest?.(headingSelector+','+navSelector)){schedule();return;}
   for(const node of record.addedNodes){
    if(node.nodeType!==1)continue;
    if(node.matches?.(headingSelector+','+navSelector)||node.querySelector?.(headingSelector+','+navSelector)){schedule();return;}
   }
  }
 });
 observer.observe(doc.body,{subtree:true,childList:true});
}
function ready(){try{install(frame.contentDocument)}catch(e){console.warn('RT plan label update unavailable',e)}}
frame.addEventListener('load',ready);
ready();
})();
</script>
</body>
</html>
