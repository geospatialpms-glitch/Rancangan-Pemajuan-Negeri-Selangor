<title>Story Map RT MPKL | Rancangan Pemajuan Negeri Selangor</title>
<style>
/* Shared navigation and scroll CTA are rendered within index.html's RT header. */
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f5f8}
#rt-story-frame{display:block;width:100%;height:100dvh;border:0;background:#f4f5f8}
</style>
</head>
<body data-rt-page="MPKL">
<iframe id="rt-story-frame" title="Story Map Rancangan Tempatan Kuala Langat" src="../index.html?rt_page=MPKL&amp;v=20261110-audit-9859e90" loading="eager"></iframe>
<script id="uniform-plan-heading-20261112">
(function(){
'use strict';
const TITLE='PELAN MUKIM & BLOK PERANCANGAN';
const match=s=>/^\s*(?:(?:\d+(?:\.\d+)*[.)-]?)\s*)?PELAN\s+MUKIM\s*(?:(?:DAN|&|\/|SERTA|DAN\/ATAU)\s*)?(?:PELAN\s+)?BLOK\s+PERANCANGAN\s*$/i.test(String(s||'').replace(/\s+/g,' ').trim());
const selectors='h1,h2,h3,h4,h5,h6,[role="heading"],.section-title,.chapter-title,.rt-section-title';
const install=doc=>{
 if(!doc||!doc.body||doc.body.dataset.uniformPlanHeadingInstalled)return;
 doc.body.dataset.uniformPlanHeadingInstalled='1';
 let busy=false;
 const apply=()=>{if(busy)return;busy=true;try{
  doc.querySelectorAll(selectors).forEach(el=>{
    if(el.closest('script,style,nav'))return;
    if(match(el.textContent)&&el.textContent.trim()!==TITLE)el.textContent=TITLE;
  });
 }finally{busy=false}};
 apply();
 const observer=new MutationObserver(()=>{if(busy)return;apply()});
 observer.observe(doc.body,{subtree:true,childList:true,characterData:true});
};
const frame=document.getElementById('rt-story-frame');
if(frame){
 const attempt=()=>{try{install(frame.contentDocument)}catch(err){console.warn('Plan heading normalization unavailable',err)}};
 frame.addEventListener('load',attempt);attempt();
}else{
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>install(document));else install(document);
}
})();
</script>
</body>
</html>
