<html lang="ms">
<head>

<title>Story Map RT MBDK | Rancangan Pemajuan Negeri Selangor</title>
<style>

*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f5f8}
#rt-story-frame{display:block;width:100%;height:100dvh;border:0;background:#f4f5f8}
</style>
</head>
<body data-rt-page="MBDK">
<iframe id="rt-story-frame" title="Story Map Rancangan Tempatan Diraja Klang" src="../index.html?rt_page=MBDK&amp;v=20261110-direct-flow7" loading="eager"></iframe>

<script id="mbdk-iframe-flow-direct-v7">
/*
 * Direct MBDK page integration: apply styling within the same-origin iframe
 * only AFTER the ArcGIS-generated content exists, regardless of earlier
 * global timeline CSS/class names. Preserves every original historical text.
 */
(function(){
const frame=document.getElementById('rt-story-frame');if(!frame)return;
const style=String.raw`
<style id="mbdk-direct-timeline-v7">
#rt11-modal.rt-mbdk #rt11-body ul.mbdk-direct-flow,
#rt11-modal.rt-mbdk #rt11-body ol.mbdk-direct-flow{
 --fill:0px;counter-reset:mbdkstep!important;
 box-sizing:border-box!important;position:relative!important;
 display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;
 gap:24px 0!important;padding:24px 0!important;margin:24px 0 42px!important;
 list-style:none!important;background:transparent!important;width:100%!important;max-width:none!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow::before{
 content:""!important;display:block!important;position:absolute!important;
 top:0!important;bottom:0!important;left:calc(50% - 5px)!important;
 width:10px!important;height:auto!important;border-radius:9px!important;
 background:linear-gradient(180deg,#d99d53,#9e4334 25%,#e6b777 55%,#a44634 85%,#dc9c51)!important;
 box-shadow:0 0 0 6px rgba(178,102,60,.1)!important;z-index:0!important;animation:none!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow::after{
 content:""!important;position:absolute!important;top:0!important;bottom:auto!important;left:calc(50% - 5px)!important;
 width:10px!important;height:var(--fill)!important;max-height:100%!important;
 border-radius:9px!important;background:#ffe2a1!important;opacity:.55!important;z-index:1!important;
 box-shadow:0 0 15px rgba(255,194,111,.45)!important;transition:height .13s linear!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li{
 box-sizing:border-box!important;counter-increment:mbdkstep!important;position:relative!important;
 display:block!important;grid-column:1!important;align-self:start!important;min-width:0!important;
 width:auto!important;max-width:none!important;min-height:150px!important;height:auto!important;
 margin:0 46px 0 0!important;padding:22px 24px!important;
 border:1px solid #dfc0ac!important;border-top:4px solid #b86d47!important;
 border-radius:19px!important;background:linear-gradient(125deg,#fffefa,#fff0e1)!important;
 box-shadow:0 10px 24px rgba(110,54,34,.1)!important;
 color:#29364a!important;font:500 clamp(16px,1.16vw,20px)/1.7 'Plus Jakarta Sans',Arial,sans-serif!important;
 text-align:left!important;text-align-last:left!important;word-spacing:normal!important;
 list-style:none!important;opacity:1!important;transform:none!important;
 transition:translate .3s ease,box-shadow .3s ease!important;z-index:2!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li:nth-child(even){
 grid-column:2!important;margin:0 0 0 46px!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li::marker{content:""!important}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li::before{
 content:counter(mbdkstep,decimal-leading-zero)!important;position:absolute!important;
 inset:auto!important;top:calc(50% - 24px)!important;left:auto!important;right:-72px!important;
 display:grid!important;place-items:center!important;width:48px!important;height:48px!important;
 padding:0!important;box-sizing:border-box!important;background:#a64533!important;
 border:5px solid #fff0db!important;border-radius:50%!important;color:#fff!important;
 font:800 13px/1 Arial,sans-serif!important;box-shadow:0 0 0 5px #bf805644!important;
 animation:none!important;z-index:5!important;transform:none!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li:nth-child(even)::before{
 left:-72px!important;right:auto!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li::after{
 content:""!important;display:block!important;position:absolute!important;top:50%!important;
 left:auto!important;right:-46px!important;height:3px!important;width:46px!important;
 transform:translateY(-50%)!important;background:#c28356!important;
 border:0!important;opacity:1!important;z-index:1!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li:nth-child(even)::after{
 left:-46px!important;right:auto!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li:is(:hover,:focus-within){
 translate:0 -4px!important;box-shadow:0 16px 34px rgba(110,54,34,.17)!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li :is(p,span,div){
 font:inherit!important;line-height:inherit!important;text-align:left!important;
 text-align-last:left!important;word-spacing:normal!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li :is(b,strong){
 font-weight:850!important;color:#8f372c!important;
}
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow .rt-info-number,
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow .rt-final-step,
#rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow .rt-flow-index{
 display:none!important;
}
@media(max-width:810px){
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow{
  display:flex!important;flex-direction:column!important;gap:18px!important;
  padding:14px 0 14px 58px!important;margin:20px 0 32px!important;
 }
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow::before,
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow::after{
  left:19px!important;width:8px!important;
 }
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li,
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li:nth-child(even){
  width:100%!important;margin:0!important;min-height:0!important;padding:20px!important;
 }
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li::before,
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li:nth-child(even)::before{
  left:-62px!important;right:auto!important;top:22px!important;
 }
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li::after,
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li:nth-child(even)::after{
  left:-42px!important;right:auto!important;top:46px!important;width:42px!important;
 }
}
@media(prefers-reduced-motion:reduce){
 #rt11-modal.rt-mbdk #rt11-body :is(ul,ol).mbdk-direct-flow>li{transition:none!important}
}
</style>`;
let observer=null,scrollTarget=null;
function attach(){
 let d;try{d=frame.contentDocument}catch(e){return}
 if(!d)return;
 if(!d.getElementById('mbdk-direct-timeline-v7')){
   const holder=d.createElement('div');holder.innerHTML=style;
   const css=holder.firstElementChild;if(css)d.head.appendChild(css);
 }
 const root=d.getElementById('rt11-body'),modal=d.getElementById('rt11-modal');
 if(!root||!modal)return;
 let pending=false;
 function progress(){
  const view=modal.getBoundingClientRect();
  root.querySelectorAll('.mbdk-direct-flow').forEach(list=>{
   const box=list.getBoundingClientRect();
   list.style.setProperty('--fill',Math.max(0,Math.min(box.height,view.bottom-box.top))+'px');
  });
 }
 function transform(){
  pending=false;
  if(modal.hidden||!modal.classList.contains('rt-mbdk'))return;
  root.querySelectorAll('ol,ul').forEach(list=>{
   if(list.classList.contains('mbdk-direct-flow'))return;
   const rows=[...list.children].filter(e=>e.tagName==='LI');
   if(rows.length<4||rows.length>12)return;
   const text=rows.map(e=>e.textContent.toLowerCase());
   const terms=['pra kesultanan','pembentukan kesultanan','zaman british','kemerdekaan','era kontena'];
   const score=terms.filter(t=>text.some(x=>x.includes(t))).length;
   if(score<3)return;
   list.classList.add('mbdk-direct-flow');
   list.classList.remove('rt-background-infographic','rt-final-history-flow','rt-flow-timeline','rt-v3-timeline');
   list.dataset.rtMotionEnhanced='mbdk-direct-flow';
   list.dataset.rtV3='mbdk-direct-flow';
   rows.forEach(row=>row.querySelectorAll(':scope > .rt-info-number,:scope > .rt-final-step,:scope > .rt-flow-index,:scope > .rt-v3-num').forEach(n=>n.remove()));
  });
  progress();
 }
 function schedule(){
  if(pending)return;pending=true;d.defaultView.requestAnimationFrame(transform);
 }
 if(observer)observer.disconnect();
 observer=new d.defaultView.MutationObserver(records=>{
  if(records.some(r=>[...r.addedNodes].some(n=>n.nodeType===1&&(n.matches?.('section,ol,ul,.rtpiece')||n.querySelector?.('ol,ul')))))schedule();
 });
 observer.observe(root,{childList:true,subtree:true});
 if(scrollTarget)scrollTarget.removeEventListener('scroll',progress);
 scrollTarget=modal;modal.addEventListener('scroll',progress,{passive:true});
 frame.contentWindow.addEventListener('resize',progress,{passive:true});
 schedule();
}
frame.addEventListener('load',attach);
if(frame.contentDocument?.readyState==='complete')attach();
})();
</script>
</body>
</html>
