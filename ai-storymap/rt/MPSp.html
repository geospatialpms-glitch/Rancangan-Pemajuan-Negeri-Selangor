<script id="uniform-plan-heading-20261112">(function(){'use strict';const TITLE='PELAN MUKIM & BLOK PERANCANGAN';const rx=/^\s*(?:\d+(?:\.\d+)*[.)-]?\s*)?PELAN\s+MUKIM\s*(?:(?:DAN|&|\/|SERTA|DAN\/ATAU)\s*)?(?:PELAN\s+)?BLOK\s+PERANCANGAN\s*$/i;function install(doc){if(!doc?.body||doc.body.dataset.uniformPlanHeadingInstalled)return;doc.body.dataset.uniformPlanHeadingInstalled='1';let active=false;const apply=()=>{if(active)return;active=true;try{doc.querySelectorAll('h1,h2,h3,h4,h5,h6,[role="heading"],.section-title,.chapter-title,.rt-section-title').forEach(el=>{if(!el.closest('nav,script,style')&&rx.test(el.textContent.replace(/\s+/g,' ').trim())&&el.textContent.trim()!==TITLE)el.textContent=TITLE})}finally{active=false}};apply();new MutationObserver(apply).observe(doc.body,{subtree:true,childList:true,characterData:true})}const frame=document.getElementById('rt-story-frame');if(frame){const run=()=>{try{install(frame.contentDocument)}catch(e){console.warn(e)}};frame.addEventListener('load',run);run()}else if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>install(document));else install(document)})();</script>
