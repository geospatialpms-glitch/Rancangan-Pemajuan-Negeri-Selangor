<style>
:root{font-family:Arial,sans-serif;color:#fff7ec;background:#3e0d23}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
.rt-toolbar{height:50px;display:flex;align-items:center;gap:14px;justify-content:space-between;padding:6px 16px;background:linear-gradient(95deg,#500b24,#882e46);border-bottom:2px solid #e1b96c}
.rt-toolbar b{font-size:13px;letter-spacing:.02em}.rt-toolbar a{color:#fff4d6;font-size:12px;text-decoration:none;white-space:nowrap}.rt-toolbar a:hover{text-decoration:underline}
.rt-toolbar nav{display:flex;align-items:center;gap:16px}
#rt-story-frame{display:block;width:100%;height:calc(100dvh - 50px);border:0;background:#fff9f4}
@media(max-width:650px){.rt-toolbar{padding:6px 9px;gap:7px}.rt-toolbar b{font-size:11px}.rt-toolbar nav{gap:8px}.rt-toolbar nav a{font-size:10px}}
</style>
</head>
<body data-rt-page="MPSp">
<header class="rt-toolbar">
<b>RANCANGAN TEMPATAN · MPSp</b>
<nav aria-label="Navigasi halaman RT">

<a href="./MPKL.html" title="RT seterusnya">Seterusnya ›</a>
</nav>

<iframe id="rt-story-frame" title="Story Map Rancangan Tempatan Sepang" src="../index.html?rt_page=MPSp" loading="eager"></iframe>
<script>
/* Halaman khusus MPSp: letakkan penyesuaian gaya untuk RT ini di bawah.
   Kandungan asas masih dibaca daripada portal utama agar maklumat asal terpelihara. */
const frame=document.getElementById('rt-story-frame');
frame.addEventListener('load',()=>{
 try{
  const doc=frame.contentDocument;
  if(!doc)return;
  const style=doc.createElement('style');
  style.id='rt-page-MPSp-overrides';
  style.textContent='/* Custom CSS for RT MPSp only */';
  doc.head.appendChild(style);
 }catch(err){console.warn('RT page styling is unavailable',err)}
});
</script>
</body>
