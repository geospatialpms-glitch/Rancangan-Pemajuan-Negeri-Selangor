(function(){
'use strict';
const frame=document.getElementById('rt-story-frame');
if(!frame)return;
const normalize=s=>String(s||'').replace(/\s+/g,' ').trim();
const make=(doc,tag,cls,txt)=>{const node=doc.createElement(tag);node.className=cls;if(txt!==undefined)node.textContent=txt;return node;};
const conceptNames=[
 'Konsep Jaringan Sistem Pengangkutan',
 'Konsep Hierarki Perbandaran',
 'Konsep Pembangunan Koridor',
 'Konsep Kluster Pembangunan'
];
const pillarNames=['Teras Satu','Teras Dua','Teras Tiga','Teras Empat','Teras Lima','Teras Enam'];
const separate=(raw,name)=>{
 const normalized=normalize(raw).replace(/^\d{1,2}\s+/,'');
 const index=normalized.toLowerCase().indexOf(name.toLowerCase());
 if(index>=0){
  const rest=normalized.slice(index+name.length).replace(/^[\s:–—-]+/,'').trim();
  return [name,rest];
 }
 const dash=normalized.search(/\s[–—-]\s/);
 if(dash>0)return [normalized.slice(0,dash),normalized.slice(dash+3)];
 return [normalized,''];
};
const findSection=(body,re)=>[...body.querySelectorAll('.rtchapter')].find(section=>re.test(normalize(section.querySelector(':scope > h2')?.textContent||'')));
const getRows=(section,names)=>{
 const matching=[];
 for(const list of section.querySelectorAll('.rtpiece ul,.rtpiece ol')){
  const rows=[...list.children].filter(x=>x.tagName==='LI');
  for(const row of rows) {
   const text=normalize(row.textContent);
   const index=names.findIndex(name=>text.toLowerCase().includes(name.toLowerCase()));
   if(index>=0&&!matching.some(x=>x.index===index))matching.push({index,row,list,text});
  }
 }
 return matching.sort((a,b)=>a.index-b.index);
};
function renderConcept(doc,section){

 for(const {index,row,text} of rows){
  const name=conceptNames[index],description=separate(text,name)[1],num=String(index+1).padStart(2,'0');

  card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-pressed','false');
  card.setAttribute('aria-label','Konsep '+num+': '+name+'. Klik untuk huraian');
  const inner=make(doc,'div','mps-direct-flip-inner');
  function face(back){
   const face=make(doc,'div','mps-direct-flip-face mps-direct-flip-'+(back?'back':'front'));
   face.append(make(doc,'span','mps-direct-flip-orb','✧'),
     make(doc,'span','mps-direct-flip-kicker',back?'KONSEP '+num+' · HURAIAN':'KONSEP '+num),
     make(doc,'div',back?'mps-direct-flip-description':'mps-direct-flip-title',back?(description||name):name),
     make(doc,'span','mps-direct-flip-hint',back?'KLIK UNTUK KEMBALI ↻':'HALAKAN TETIKUS ATAU KLIK UNTUK TEROKA ↻'));
   return face;
  }

  card.addEventListener('click',()=>flip(!card.classList.contains('is-flipped')));
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip(!card.classList.contains('is-flipped'))}if(e.key==='Escape')flip(false)});
  grid.append(card);
 }
 const first=rows[0].list;first.parentNode.insertBefore(grid,first);
 for(const {row} of rows)row.remove();
 for(const list of new Set(rows.map(x=>x.list)))if(!list.querySelector('li'))list.remove();
}
function renderPillars(doc,section){
 if(!section||section.querySelector('.mps-direct-pillar-grid'))return;

 if(rows.length!==6)return;

 for(const {index,row,text} of rows){
  const num=String(index+1).padStart(2,'0'),label=pillarNames[index],split=separate(text,label);
  const title=split[1]||split[0];
  const card=make(doc,'article','mps-direct-pillar-card');
  const top=make(doc,'div','mps-direct-pillar-top');
  top.append(make(doc,'span','mps-direct-pillar-number',num),make(doc,'span','mps-direct-pillar-orb','✧'));
  card.append(top,make(doc,'span','mps-direct-pillar-label','TERAS '+num),make(doc,'h3','mps-direct-pillar-title',title));
  grid.append(card);
 }
 const first=rows[0].list;first.parentNode.insertBefore(grid,first);
 for(const {row} of rows)row.remove();
 for(const list of new Set(rows.map(x=>x.list)))if(!list.querySelector('li'))list.remove();
}
function init(){

 try{doc=frame.contentDocument;if(!doc)return;}catch(err){return;}

 style.textContent=FRAME_STYLE;
 doc.head.append(style);
 const body=doc.getElementById('rt11-body');if(!body)return;
 let scheduled=false;
 function apply(){

  try{
   renderConcept(doc,findSection(body,/konsep pembangunan/i));

})();

<script id="uniform-plan-heading-20261112">(function(){'use strict';const TITLE='PELAN MUKIM & BLOK PERANCANGAN';const rx=/^\s*(?:\d+(?:\.\d+)*[.)-]?\s*)?PELAN\s+MUKIM\s*(?:(?:DAN|&|\/|SERTA|DAN\/ATAU)\s*)?(?:PELAN\s+)?BLOK\s+(?:PERANCANGAN|[A-Z]{2,6})\s*$/i;function install(doc){if(!doc?.body||doc.body.dataset.uniformPlanHeadingInstalled)return;doc.body.dataset.uniformPlanHeadingInstalled='1';let active=false;const apply=()=>{if(active)return;active=true;try{doc.querySelectorAll('h1,h2,h3,h4,h5,h6,[role="heading"],.section-title,.chapter-title,.rt-section-title').forEach(el=>{if(!el.closest('nav,script,style')&&rx.test(el.textContent.replace(/\s+/g,' ').trim())&&el.textContent.trim()!==TITLE)el.textContent=TITLE})}finally{active=false}};apply();new MutationObserver(apply).observe(doc.body,{subtree:true,childList:true,characterData:true})}const frame=document.getElementById('rt-story-frame');if(frame){const run=()=>{try{install(frame.contentDocument)}catch(e){console.warn(e)}};frame.addEventListener('load',run);run()}else if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>install(document));else install(document)})();</script>
