name: Refresh Story Map GA4 visitor counts

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: ga4-storymap-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: "559302911"
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Explain missing GA4 authorization
        if: env.GA4_SERVICE_ACCOUNT_JSON == ''
        run: echo "::notice::GA4 property 559302911 has been configured. Connect a Google service account with Analytics Viewer access and add GA4_SERVICE_ACCOUNT_JSON to repository secrets to enable visitor counts."
      - name: Checkout repository
        if: env.GA4_SERVICE_ACCOUNT_JSON != ''
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: env.GA4_SERVICE_ACCOUNT_JSON != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query GA4 Data API
        if: env.GA4_SERVICE_ACCOUNT_JSON != ''
        run: node scripts/update-ga-visitors.mjs
      - name: Commit visitor summary when changed
        if: env.GA4_SERVICE_ACCOUNT_JSON != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-storymap/visitor-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GA4 Story Map visitor summary"
            # Portal edits can land while this scheduled run is in progress.
            # Rebase the statistics-only commit so a concurrent push does not
            # silently stop daily visitor updates.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                echo "GA4 visitor statistics published successfully"
                exit 0
              fi
              echo "Concurrent commit detected; retrying publication ($attempt/3)"
              sleep 5
            done
            echo "::error::Unable to publish GA4 statistics after 3 attempts"
            exit 1
          fi
